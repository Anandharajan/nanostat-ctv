name: ci
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -p no:cacheprovider
      - name: CLI smoke
        run: |
          nanostat factory --profile smoke --out data
          nanostat eval --arms B0 --suite nanostat --data data --split train
