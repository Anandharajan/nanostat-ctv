# Estimand-keyed admissible-set policy registry for M0/M1 methods (SPEC v3.1 §2.3).
#
# A(x, e) = estimand_options[e] for the estimands the protocol allows (all estimands when the
# protocol does not lock one). B(x, e) = `invalid` plus, when the estimand is locked, every method
# admissible only for another estimand (reason: estimand_mismatch). Methods in neither set are
# "unknown" and are rejected in confirmatory mode.
#
# Every cell is reviewed_by: PENDING -> pilot use only, never confirmatory runs.
# Within an estimand the first method is the registry's preferred (conventional) method.

- cell: {design: independent_two_group, outcome: continuous, perturbation: none}
  estimand_options:
    mean_difference: [welch_t, student_t, permutation_test]
    location_shift: [mann_whitney]
    trimmed_mean_difference: [yuen_trimmed_t]
  invalid:
    - {method: paired_t, reason: design_mismatch_no_pairing}
    - {method: wilcoxon_signed_rank, reason: design_mismatch_no_pairing}
    - {method: chi2_independence, reason: outcome_type_mismatch}
    - {method: fisher_exact, reason: outcome_type_mismatch}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: independent_two_group, outcome: continuous, perturbation: unequal_variance}
  estimand_options:
    mean_difference: [welch_t]
    trimmed_mean_difference: [yuen_trimmed_t]
  invalid:
    - {method: student_t, reason: pooled_variance_under_heteroscedasticity}
    - {method: permutation_test, reason: exchangeability_violated_unequal_variance}
    - {method: mann_whitney, reason: distribution_null_violated_unequal_variance}
    - {method: paired_t, reason: design_mismatch_no_pairing}
    - {method: wilcoxon_signed_rank, reason: design_mismatch_no_pairing}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: independent_two_group, outcome: continuous, perturbation: heavy_outliers}
  estimand_options:
    mean_difference: [permutation_test]
    location_shift: [mann_whitney]
    trimmed_mean_difference: [yuen_trimmed_t]
  invalid:
    - {method: student_t, reason: outlier_driven_inference}
    - {method: welch_t, reason: outlier_driven_inference}
    - {method: paired_t, reason: design_mismatch_no_pairing}
    - {method: wilcoxon_signed_rank, reason: design_mismatch_no_pairing}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: independent_two_group, outcome: continuous, perturbation: skewed}
  estimand_options:
    mean_difference: [permutation_test, welch_t]
    location_shift: [mann_whitney]
    trimmed_mean_difference: [yuen_trimmed_t]
  invalid:
    - {method: student_t, reason: non_normal_pooled_variance}
    - {method: paired_t, reason: design_mismatch_no_pairing}
    - {method: wilcoxon_signed_rank, reason: design_mismatch_no_pairing}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: independent_two_group, outcome: binary, perturbation: none}
  estimand_options:
    association: [chi2_independence, fisher_exact]
  invalid:
    - {method: student_t, reason: outcome_type_mismatch}
    - {method: welch_t, reason: outcome_type_mismatch}
    - {method: mann_whitney, reason: outcome_type_mismatch}
    - {method: permutation_test, reason: outcome_type_mismatch}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: independent_two_group, outcome: binary, perturbation: small_expected_counts}
  estimand_options:
    association: [fisher_exact]
  invalid:
    - {method: chi2_independence, reason: expected_counts_below_5}
    - {method: student_t, reason: outcome_type_mismatch}
    - {method: welch_t, reason: outcome_type_mismatch}
    - {method: mann_whitney, reason: outcome_type_mismatch}
    - {method: permutation_test, reason: outcome_type_mismatch}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: paired, outcome: continuous, perturbation: none}
  estimand_options:
    mean_difference_paired: [paired_t, permutation_test]
    location_shift: [wilcoxon_signed_rank]
  invalid:
    - {method: welch_t, reason: design_mismatch_ignores_pairing}
    - {method: student_t, reason: design_mismatch_ignores_pairing}
    - {method: mann_whitney, reason: design_mismatch_ignores_pairing}
  clarify_if: [pair_id_missing]
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: paired, outcome: continuous, perturbation: heavy_outliers}
  estimand_options:
    mean_difference_paired: [permutation_test]
    location_shift: [wilcoxon_signed_rank]
  invalid:
    - {method: paired_t, reason: outlier_driven_inference}
    - {method: welch_t, reason: design_mismatch_ignores_pairing}
    - {method: student_t, reason: design_mismatch_ignores_pairing}
    - {method: mann_whitney, reason: design_mismatch_ignores_pairing}
  clarify_if: [pair_id_missing]
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: paired, outcome: continuous, perturbation: skewed}
  estimand_options:
    mean_difference_paired: [permutation_test, paired_t]
    location_shift: [wilcoxon_signed_rank]
  invalid:
    - {method: welch_t, reason: design_mismatch_ignores_pairing}
    - {method: student_t, reason: design_mismatch_ignores_pairing}
    - {method: mann_whitney, reason: design_mismatch_ignores_pairing}
  clarify_if: [pair_id_missing]
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: correlation, outcome: continuous, perturbation: none}
  estimand_options:
    correlation: [pearson, permutation_test]
    rank_correlation: [spearman]
  invalid: []
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: correlation, outcome: continuous, perturbation: heavy_outliers}
  estimand_options:
    rank_correlation: [spearman]
  invalid:
    - {method: pearson, reason: outlier_driven_inference}
    - {method: permutation_test, reason: outlier_driven_inference}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: correlation, outcome: continuous, perturbation: skewed}
  estimand_options:
    correlation: [permutation_test]
    rank_correlation: [spearman]
  invalid:
    - {method: pearson, reason: non_normal_small_sample}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: k_group, outcome: continuous, perturbation: none}
  estimand_options:
    group_means_equal: [anova_oneway]
    group_distributions_equal: [kruskal_wallis]
  invalid: []
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: k_group, outcome: continuous, perturbation: heavy_outliers}
  estimand_options:
    group_distributions_equal: [kruskal_wallis]
  invalid:
    - {method: anova_oneway, reason: outlier_driven_inference}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: k_group, outcome: continuous, perturbation: skewed}
  estimand_options:
    group_distributions_equal: [kruskal_wallis]
  invalid:
    - {method: anova_oneway, reason: non_normal_small_sample}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: k_group, outcome: continuous, perturbation: unequal_variance}
  estimand_options:
    group_means_equal: []
  invalid:
    - {method: anova_oneway, reason: pooled_variance_under_heteroscedasticity}
    - {method: kruskal_wallis, reason: distribution_null_violated_unequal_variance}
  reviewed_by: PENDING
  version: 0.2.0

- cell: {design: one_sample, outcome: binary, perturbation: none}
  estimand_options:
    proportion: [binomial_test]
  invalid: []
  clarify_if: [p0_missing]
  reviewed_by: PENDING
  version: 0.2.0

# ---- M4 model-based designs (v0.3.0). Admissibility here is by outcome type only; whether the
# ---- SPECIFICATION (covariates, SE type, clustering, instruments) is right is not judged by the
# ---- registry and must be reviewed by a statistician.

- cell: {design: regression, outcome: continuous, perturbation: none}
  estimand_options:
    coefficient: [ols_coef, iv_2sls, mixed_lm, tobit]
    linear_restriction: [ols_wald, ols_coef]
  invalid:
    - {method: logistic, reason: outcome_type_mismatch}
    - {method: probit, reason: outcome_type_mismatch}
  reviewed_by: PENDING
  version: 0.3.0

- cell: {design: regression, outcome: binary, perturbation: none}
  estimand_options:
    coefficient: [logistic, probit, ols_coef, iv_2sls]
    linear_restriction: [ols_wald, logistic, probit]
  invalid:
    - {method: tobit, reason: outcome_type_mismatch}
    - {method: mixed_lm, reason: linear_mixed_model_on_binary_outcome}
  reviewed_by: PENDING
  version: 0.3.0

- cell: {design: survival, outcome: time_to_event, perturbation: none}
  estimand_options:
    hazard_ratio: [cox_ph]
    survival_curves_equal: [log_rank]
    linear_restriction: [cox_ph]
  invalid: []
  reviewed_by: PENDING
  version: 0.3.0
