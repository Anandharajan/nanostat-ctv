[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nanostat-ctv"
version = "0.2.0"
description = "Small, auditable statistical agents: typed analysis plans, a whitelisted CPU executor, admissible-set rewards and counterfactual design twins."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Anandharajan TRV" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.9",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "httpx>=0.25", "types-PyYAML"]
gpu = ["torch", "transformers", "peft", "bitsandbytes", "accelerate", "trl", "datasets"]

[project.scripts]
nanostat = "nanostat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["nanostat", "benchmark", "training", "evaluation"]

[tool.hatch.build.targets.wheel.force-include]
"configs/policies" = "nanostat/_policies"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "UP007", "UP045", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["nanostat"]
